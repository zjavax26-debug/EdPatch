name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compilar Proyecto Android
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Java (JDK 17 es el estándar actual para Android)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Dar permisos de ejecución al script de Gradle (Gradlew)
      - name: Dar permisos a Gradlew
        run: chmod +x gradlew

      # 4. Compilar el APK de depuración (Debug)
      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug

      # 5. Compilar el AAB para Google Play (Release - Opcional/Requiere firmar)
      - name: Compilar Bundle AAB (Release)
        run: ./gradlew bundleRelease

      # 6. Guardar el APK generado como un artefacto descargable en GitHub
      - name: Subir APK (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 7. Subir el AAB generado como artefacto
      - name: Subir AAB (Release)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
